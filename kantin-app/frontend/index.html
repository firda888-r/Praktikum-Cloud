<!DOCTYPE html>
<html>

<head>
    <title>Katalog Lagu Favorite</title>
</head>

<body>
    <h1 id="judul">Memuat...</h1>
    <p id="owner"></p>
    <ul id="menu-list"></ul>

    <hr>

    <h3>Tambah Item:</h3>
    <input type="text" id="menu-input" placeholder="Nama item...">
    <button onclick="tambahMenu()">Tambah</button>

    <script>
        const API_URL = '/api';

        // ======================
        // LOAD DATA DARI BACKEND
        // ======================
        function loadData() {
            fetch(`${API_URL}/info`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('judul').innerText = data.judul_katalog;
                    document.getElementById('owner').innerText =
                        data.pemilik + " (" + data.nim + ")";

                    const list = document.getElementById('menu-list');
                    list.innerHTML = '';

                    data.items.forEach(item => {
                        let li = document.createElement('li');
                        li.innerText = item;
                        list.appendChild(li);
                    });
                })
                .catch(err => {
                    console.error("Gagal load data:", err);
                });
        }

        // ======================
        // TAMBAH ITEM
        // ======================
        function tambahMenu() {
            const input = document.getElementById('menu-input');

            if (!input.value) {
                alert("Item tidak boleh kosong!");
                return;
            }

            fetch(`${API_URL}/add-item`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ item: input.value })
            })
                .then(res => res.json())
                .then(() => {
                    input.value = '';
                    loadData();
                })
                .catch(err => {
                    console.error("Gagal tambah item:", err);
                });
        }

        // ======================
        // INIT
        // ======================
        loadData();
    </script>

</body>

</html>
